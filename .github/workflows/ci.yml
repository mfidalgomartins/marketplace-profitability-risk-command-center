name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libharfbuzz-subset0 libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy

      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r src -q

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Rebuild Pipeline Artifacts
        run: |
          python src/pipeline/run_full_pipeline.py \
            --raw-dir data/raw \
            --processed-dir data/processed \
            --dashboard-file outputs/dashboard/executive-marketplace-command-center.html \
            --pages-dashboard-file .pages/executive-marketplace-command-center.html \
            --pages-index-file .pages/index.html \
            --monte-carlo-iterations 2000 \
            --schema-file config/contracts/v1/schema_contracts.json \
            --metric-contract-file config/contracts/v1/metric_governance_contract.csv \
            --schema-history-dir config/contracts/history \
            --reports-dir reports \
            --required-release-state decision-support\ only

      - name: Verify deterministic governed artifacts
        run: |
          git diff --exit-code -- data config reports outputs .pages
          cmp outputs/dashboard/executive-marketplace-command-center.html .pages/executive-marketplace-command-center.html

      - name: Run tests
        run: |
          python -m pip check
          python -m compileall -q src tests
          pytest -q

      - name: Smoke validation runner
        run: |
          python src/validation/validate_schema_contracts.py --schema-file config/contracts/v1/schema_contracts.json --output-file reports/schema_contract_issues.csv
          python src/validation/validate_metric_governance.py --raw-dir data/raw --processed-dir data/processed --reports-dir reports --contract-file config/contracts/v1/metric_governance_contract.csv --output-file reports/metric_governance_issues.csv
          python src/validation/generate_schema_drift_report.py --current-schema-file config/contracts/v1/schema_contracts.json --history-dir config/contracts/history --output-csv reports/schema_drift_changes.csv --output-report reports/schema_drift_report.md
          python src/validation/run_full_validation.py --raw-dir data/raw --processed-dir data/processed --report-dir reports --schema-file config/contracts/v1/schema_contracts.json --metric-contract-file config/contracts/v1/metric_governance_contract.csv
          python src/validation/enforce_release_gate.py --release-file reports/validation_release_assessment.csv --required-state decision-support\ only

      - name: Upload validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-artifacts
          path: |
            reports/schema_drift_report.md
            reports/schema_drift_changes.csv
            reports/validation_release_assessment.csv
            reports/metric_governance_issues.csv
            reports/warehouse_validation.csv
            data/processed/model_release_assessment.csv
            data/processed/finance_reconciliation.csv
            data/processed/experiment_results.csv
            outputs/reports/marketplace-command-center-report.pdf
